<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:14px;font-family:'Plus Jakarta Sans',sans-serif">
  <div style="position:relative;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:18px;overflow:hidden;background:radial-gradient(85% 85% at 100% 100%, rgba(178,245,47,0.16), transparent 70%), linear-gradient(135deg,#121510,#0E120C);box-shadow:inset 0 0 0 1px rgba(244,246,240,0.08)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:46px;height:46px;border-radius:14px;background:#181B15;color:#B2F52F;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
      <span style="{{ vm.heroBadgeStyle }}">{{ vm.statusLabel }}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
      <span style="font-size:24px;line-height:29px;font-weight:700;letter-spacing:-0.6px;color:#F4F6F0;overflow-wrap:anywhere">{{ vm.title }}<span style="color:#B2F52F">.</span></span>
      <span style="font-size:13.5px;line-height:19px;font-weight:500;color:#A9AEA3">{{ vm.meta }}</span>
    </div>
  </div>
  <div style="border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:4px 18px">
    <sc-for list="{{ vm.info }}" as="it" hint-placeholder-count="3">
      <div style="{{ it.style }}">
        <span style="font-size:13.5px;font-weight:500;color:var(--muted)">{{ it.label }}</span>
        <span style="font-size:14px;font-weight:600;color:var(--text);text-align:right">{{ it.value }}</span>
      </div>
    </sc-for>
  </div>
  <div style="border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--subtle)">HISTÓRICO</span>
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ vm.events }}" as="ev" hint-placeholder-count="2">
        <div style="display:flex;align-items:flex-start;gap:10px;min-height:42px">
          <span style="{{ ev.haloStyle }}"><span style="{{ ev.dotStyle }}"></span></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14.5px;font-weight:500;color:var(--text)">{{ ev.title }}</span>
            <span style="font-size:12.5px;font-weight:500;color:var(--muted);overflow-wrap:anywhere">{{ ev.meta }}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ vm.isPending }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:10px">
      <button type="button" onClick="{{ vm.onRotate }}" style="height:58px;border:none;border-radius:20px;background:#B2F52F;color:#0A0C09;padding:0 7px 0 22px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:700 14px 'Plus Jakarta Sans',sans-serif;box-shadow:0 14px 34px -16px rgba(178,245,47,0.6);transition:background-color .2s,transform .12s" style-hover="background:#BEF94A;" style-active="transform:scale(0.985);">
        <span>Gerar novo link</span>
        <span style="width:44px;height:44px;border-radius:15px;background:#0A0C09;color:#B2F52F;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></span>
      </button>
      <button type="button" onClick="{{ vm.onRevoke }}" style="height:54px;border:none;border-radius:16px;background:var(--dangerS);color:var(--dangerT);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:600 14px 'Plus Jakarta Sans',sans-serif;transition:opacity .15s" style-hover="opacity:0.85;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="m4.9 4.9 14.2 14.2"></path></svg>Revogar convite
      </button>
    </div>
  </sc-if>
  <sc-if value="{{ vm.notPending }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ vm.onNew }}" style="height:60px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);color:var(--text);padding:0 7px 0 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:600 15px 'Plus Jakarta Sans',sans-serif;transition:border-color .15s,transform .12s" style-hover="border-color:var(--accent);" style-active="transform:scale(0.985);">
      <span>Gerar novo convite</span>
      <span style="width:46px;height:46px;border-radius:15px;background:#B2F52F;color:#0A0C09;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></span>
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:640},&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
